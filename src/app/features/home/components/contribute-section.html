<section class="section section-alt">
  <div class="container">
    <app-section-title
      title="How You Can Help"
      subtitle="There are many ways to be part of the GreenVriksha movement — big or small, every contribution matters."
      [centered]="true"
    />
    <div class="contribute-grid">
      @for (way of ways; track way.title) {
        <div class="contribute-card color-{{ way.color }}">
          <div class="contribute-emoji">{{ way.emoji }}</div>
          <h3>{{ way.title }}</h3>
          <p>{{ way.desc }}</p>
          <a [routerLink]="way.link" class="contribute-link">
            {{ way.linkLabel }}
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
          </a>
        </div>
      }
    </div>
  </div>
</section>
