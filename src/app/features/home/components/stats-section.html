<section class="stats-section">
  <div class="container">
    <div class="stats-grid">
      @for (stat of stats; track stat.label) {
        <app-stat-card
          [value]="stat.value"
          [label]="stat.label"
          [icon]="stat.icon"
          [color]="stat.color"
        />
      }
    </div>
  </div>
</section>
