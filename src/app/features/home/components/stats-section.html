<section class="impact-band">
  <div class="container">
    <p class="impact-eyebrow">GreenVriksha Nagpur — Our Impact Since 2024</p>
    <div class="impact-grid">
      @for (s of stats; track s.label) {
        <div class="impact-item">
          <div class="impact-emoji">{{ s.emoji }}</div>
          <div class="impact-num">{{ s.value }}</div>
          <div class="impact-lbl">{{ s.label }}</div>
        </div>
      }
    </div>
  </div>
</section>
