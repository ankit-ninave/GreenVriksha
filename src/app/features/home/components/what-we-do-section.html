<section class="section section-alt">
  <div class="container">
    <app-section-title style="text-align: center; align-items: center;"
      title="What We Do Every Sunday"
      subtitle="Four focused activities that make Nagpur greener — week after week."
      [centered]="true"
    />
    <div class="activities-grid">
      @for (item of activities; track item.title) {
        <app-feature-card
          [icon]="item.icon"
          [title]="item.title"
          [description]="item.description"
          [color]="item.color"
        />
      }
    </div>
  </div>
</section>
