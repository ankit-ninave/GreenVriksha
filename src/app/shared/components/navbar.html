<nav class="navbar">
  <div class="container navbar-inner">
    <!-- Logo -->
    <a routerLink="/" class="logo" (click)="closeMenu()">
      <svg class="logo-icon" viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="18" fill="var(--green-light)" />
        <path d="M20 8C16 8 12 12 12 18c0 8 8 15 8 15s8-7 8-15c0-6-4-10-8-10z" fill="var(--green)" />
        <path d="M16 16c2-4 4-6 4-6s2 2 4 6" fill="var(--primary-light)" />
        <circle cx="20" cy="18" r="3" fill="var(--primary)" />
      </svg>
      <div class="logo-text">
        <span class="logo-name">GreenVriksha</span>
        <span class="logo-loc">Nagpur</span>
      </div>
    </a>

    <!-- Desktop Nav -->
    <ul class="nav-links">
      @for (item of navItems; track item.path) {
        <li>
          <a
            [routerLink]="item.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.exact }"
            (click)="closeMenu()"
          >
            {{ item.label }}
          </a>
        </li>
      }
      <li>
        <a routerLink="/volunteer" class="btn btn-primary nav-cta" (click)="closeMenu()">
          Join Us
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
        </a>
      </li>
    </ul>

    <!-- Mobile Toggle -->
    <button class="mobile-toggle" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen()" aria-label="Toggle navigation menu">
      <span class="bar" [class.open]="isMenuOpen()"></span>
      <span class="bar" [class.open]="isMenuOpen()"></span>
      <span class="bar" [class.open]="isMenuOpen()"></span>
    </button>
  </div>

  <!-- Mobile Drawer -->
  @if (isMenuOpen()) {
    <div class="mobile-menu">
      <ul class="mobile-nav-links">
        @for (item of navItems; track item.path) {
          <li>
            <a
              [routerLink]="item.path"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: item.exact }"
              (click)="closeMenu()"
            >
              {{ item.label }}
            </a>
          </li>
        }
        <li>
          <a routerLink="/volunteer" class="btn btn-primary w-full text-center" (click)="closeMenu()">Join Us</a>
        </li>
      </ul>
    </div>
  }
</nav>
